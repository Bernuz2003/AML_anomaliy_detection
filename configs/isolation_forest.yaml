seed: 42

data:
  path: null
  format: auto
  run_col: run_id
  time_col: t
  label_col: label
  split_col: null
  anomaly_col: anomaly
  action_col: action
  kuka_run_strategy: action_segments
  kuka_fixed_run_length: 512
  normal_label: 0
  feature_cols: null
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  stratify_by_label: true

preprocessing:
  scaler: standard
  fit_only_normal: true
  missing_strategy: interpolate

windowing:
  window_length: 64
  stride: 16
  anomaly_fraction: 0.10

model:
  type: isolation_forest
  n_estimators: 200
  contamination: auto
  feature_mode: statistical

evaluation:
  threshold: best_f1
  fallback_percentile: 99.0
